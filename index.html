<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario MonteCristo 2026 · ¡Vive tu Ascenso!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --summit:#0E2A31;      /* deep pine-teal night */
  --slate:#173C46;       /* slate pine */
  --mist:#F3F6F5;        /* cool misty paper */
  --card:#FFFFFF;
  --ink:#12262B;
  --ink-soft:#4A6169;
  --line:#D9E4E2;
  --dawn:#E0A340;        /* sunrise gold accent */
  --dawn-deep:#C6852A;
  /* dimension colors */
  --d-humana:#D9713C;
  --d-espiritual:#7A5AA8;
  --d-pastoral:#0E8A8A;
  --d-economia:#2E8B57;
  --d-todos:#2C5C8A;
  --d-decanatal:#6B7B86;
  --d-cumple:#C25B87;
  --d-parroquial:#B08432;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--mist);color:var(--ink);
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- HEADER ---------- */
header{
  background:
    radial-gradient(120% 90% at 80% -10%, rgba(224,163,64,.22), transparent 55%),
    linear-gradient(160deg,var(--summit),var(--slate));
  color:#EAF2F0;padding:40px 0 0;position:relative;overflow:hidden;
}
.brand{display:flex;align-items:center;gap:16px;position:relative;z-index:2}
.mark{width:52px;height:52px;flex:none}
.brand-txt .eyebrow{
  font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--dawn);font-weight:600
}
.brand-txt h1{
  font-family:'Spectral',serif;font-weight:600;font-size:1.9rem;
  letter-spacing:.01em;line-height:1.1;color:#fff
}
.brand-txt .sub{font-size:.86rem;color:#B7CBC8;margin-top:2px}

.next-banner{
  margin-top:28px;display:flex;flex-wrap:wrap;align-items:flex-end;
  gap:8px 28px;padding:18px 0 26px;border-top:1px solid rgba(255,255,255,.12);
  position:relative;z-index:2
}
.next-banner .label{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#9FBAB6}
.next-title{font-family:'Spectral',serif;font-size:1.35rem;color:#fff;font-weight:500}
.next-meta{font-size:.85rem;color:#C9DAD7}
.countdown{margin-left:auto;text-align:right}
.countdown .num{font-family:'Spectral',serif;font-size:2.1rem;color:var(--dawn);line-height:1;font-weight:600}
.countdown .cap{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:#9FBAB6}

/* mountain silhouette */
.range{position:absolute;left:0;right:0;bottom:0;height:70px;z-index:1;opacity:.5}

/* ---------- UPCOMING ---------- */
.upcoming{padding:26px 0 6px}
.section-h{
  font-family:'Spectral',serif;font-size:1.15rem;font-weight:600;
  display:flex;align-items:center;gap:10px;margin-bottom:14px
}
.section-h::before{content:"";width:22px;height:2px;background:var(--dawn);display:inline-block}
.up-scroll{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.up-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 15px 13px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  transition:transform .15s ease,box-shadow .15s ease
}
.up-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px -12px rgba(14,42,49,.35)}
.up-card .accent{position:absolute;top:0;left:0;width:4px;height:100%}
.up-when{font-size:.72rem;font-weight:600;letter-spacing:.04em;color:var(--ink-soft);text-transform:uppercase}
.up-name{font-family:'Spectral',serif;font-size:1.02rem;font-weight:600;margin:6px 0 6px;line-height:1.25}
.up-detail{font-size:.8rem;color:var(--ink-soft);line-height:1.4;margin-bottom:11px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.up-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.up-dim{font-size:.66rem;font-weight:700;color:#fff;padding:3px 8px;border-radius:999px;letter-spacing:.02em}
.up-in{font-size:.74rem;color:var(--dawn-deep);font-weight:700;white-space:nowrap}

/* ---------- CONTROLS ---------- */
.controls{position:sticky;top:0;z-index:20;
  background:rgba(243,246,245,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:14px 0 12px;border-bottom:1px solid var(--line)}
.searchrow{display:flex;gap:12px;align-items:center;margin-bottom:11px}
.search{
  flex:1;min-width:0;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 13px;
  transition:border-color .15s,box-shadow .15s
}
.search:focus-within{border-color:var(--d-pastoral);box-shadow:0 0 0 3px rgba(14,138,138,.12)}
.search input{border:0;outline:0;font-size:.9rem;width:100%;background:transparent;color:var(--ink)}
.search svg{flex:none;color:var(--ink-soft)}
.search .clr{cursor:pointer;color:var(--ink-soft);flex:none;display:none;border:0;background:none;padding:2px}
.search .clr.show{display:inline-flex}
.count-badge{font-size:.82rem;color:var(--ink-soft);white-space:nowrap;flex:none}
.count-badge b{color:var(--summit);font-family:'Spectral',serif;font-size:1.05rem;font-weight:700}

/* filter bar: segmented controls + month */
.filterbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:#E7EEED;border-radius:10px;padding:3px;gap:2px}
.seg button{
  font-family:inherit;border:0;background:transparent;padding:7px 13px;border-radius:8px;
  font-size:.82rem;color:var(--ink-soft);cursor:pointer;font-weight:500;white-space:nowrap;
  transition:all .12s ease
}
.seg button:hover:not(.on){color:var(--summit)}
.seg button.on{background:#fff;color:var(--summit);box-shadow:0 1px 3px rgba(14,42,49,.14);font-weight:600}

/* month filter chips */
.month-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.mchip{
  font-family:inherit;font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);
  transition:all .12s ease;user-select:none;white-space:nowrap
}
.mchip:hover:not(.on){border-color:var(--summit);color:var(--summit)}
.mchip.on{background:var(--summit);color:#fff;border-color:var(--summit)}
@media(max-width:640px){
  .month-row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .month-row::-webkit-scrollbar{display:none}
  .mchip{flex:none}
}

/* dimensions header */
.filt-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 9px}
.filt-head .lbl{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.filt-head .acts{display:flex;gap:16px}
.linkbtn{background:none;border:0;font-family:inherit;font-size:.78rem;font-weight:600;
  color:var(--d-pastoral);cursor:pointer;padding:0}
.linkbtn:hover{text-decoration:underline}
.linkbtn:disabled{color:var(--line);cursor:default;text-decoration:none}

/* dimension chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  font-size:.82rem;font-weight:600;padding:7px 13px 7px 10px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);
  display:inline-flex;align-items:center;gap:7px;transition:all .13s ease;user-select:none
}
.chip:hover{border-color:var(--dc)}
.chip .swatch{width:10px;height:10px;border-radius:50%;flex:none}
.chip .check{width:13px;height:13px;flex:none;display:none;color:var(--dc)}
.chip.active .swatch{display:none}
.chip.active .check{display:inline-flex}
.chip.active{color:var(--ink);border-color:var(--dc);background:var(--dc-tint)}
.chip .ct{font-size:.72rem;font-weight:700;color:var(--ink-soft);
  background:rgba(0,0,0,.05);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.chip.active .ct{color:var(--dc);background:#fff}
.chip.zero{opacity:.38}
@media(max-width:640px){
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .searchrow{flex-wrap:wrap}
  .count-badge{order:3;width:100%}
}

/* ---------- QUICK ROW (view toggle + Hoy/Semana/Mes) ---------- */
.quickrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg button svg{margin-right:-1px}
.quick{display:inline-flex;gap:6px}
.quick button{
  font-family:inherit;font-size:.8rem;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);transition:all .12s ease;white-space:nowrap
}
.quick button:hover:not(.on){border-color:var(--dawn-deep);color:var(--dawn-deep)}
.quick button.on{background:var(--dawn);color:#3a2a06;border-color:var(--dawn)}

/* ---------- GRID (calendar view) ---------- */
.gridwrap{padding:20px 0 60px}
.grid-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:16px}
.grid-nav button{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--summit);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  transition:all .12s ease
}
.grid-nav button:hover{border-color:var(--summit);background:var(--summit);color:#fff}
.grid-title{font-family:'Spectral',serif;font-size:1.5rem;font-weight:600;color:var(--summit);min-width:200px;text-align:center}
.grid-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.grid-head div{text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{
  min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;
  display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:border-color .12s
}
.cell.empty{background:transparent;border-color:transparent}
.cell.has:hover{border-color:var(--dawn);cursor:pointer}
.cell.today{border-color:var(--dawn);box-shadow:inset 0 0 0 1px var(--dawn)}
.cell .cnum{font-size:.82rem;font-weight:700;color:var(--ink-soft);align-self:flex-end;line-height:1}
.cell.today .cnum{background:var(--dawn);color:#3a2a06;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cell.past{opacity:.6}
.cell.sel{border-color:var(--summit);box-shadow:inset 0 0 0 1px var(--summit)}
.day-panel .card{margin-bottom:10px}
.day-panel .ev{margin-bottom:0}
.pill{font-size:.66rem;font-weight:600;color:#fff;border-radius:5px;padding:2px 5px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:.64rem;font-weight:700;color:var(--ink-soft);padding-left:2px}

/* day detail panel (grid) */
.day-panel{margin-top:20px}
.day-panel:empty{display:none}
.day-panel h3{font-family:'Spectral',serif;font-size:1.15rem;color:var(--summit);margin-bottom:12px;
  display:flex;align-items:center;gap:10px}
.day-panel h3::before{content:"";width:20px;height:2px;background:var(--dawn)}

@media(max-width:640px){
  .quickrow{gap:8px}
  .quick{flex:1;justify-content:space-between}
  .quick button{flex:1;padding:8px 6px;font-size:.76rem;text-align:center}
  .grid-title{font-size:1.2rem;min-width:150px}
  .grid,.grid-head{gap:3px}
  .grid-head div{font-size:.6rem}
  .cell{min-height:60px;padding:4px;border-radius:7px}
  .cell .cnum{font-size:.72rem}
  .cell.today .cnum{width:18px;height:18px}
  .pill{display:none}
  .dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto}
  .dot-ev{width:6px;height:6px;border-radius:50%}
}
.dots{display:none}

/* ---------- TIMELINE ---------- */
.timeline{padding:24px 0 60px;position:relative}
.month-group{margin-bottom:30px}
.month-h{
  font-family:'Spectral',serif;font-size:1.5rem;font-weight:600;color:var(--summit);
  display:flex;align-items:baseline;gap:12px;margin:10px 0 16px;
  padding-bottom:8px;border-bottom:1px solid var(--line)
}
.month-h .yr{font-size:.8rem;color:var(--ink-soft);font-weight:400;letter-spacing:.1em}
.rail{position:relative;padding-left:34px}
.rail::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(var(--line),var(--line))}
.ev{position:relative;margin-bottom:12px}
.ev::before{content:"";position:absolute;left:-30px;top:16px;width:14px;height:14px;border-radius:50%;
  background:var(--card);border:3px solid var(--dc,var(--d-todos));z-index:2}
.ev.cumple::before{width:10px;height:10px;left:-28px;top:14px;border-width:2px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:14px 16px;cursor:pointer;transition:box-shadow .15s ease,border-color .15s;
  border-left:4px solid var(--d-todos)
}
.card:hover{box-shadow:0 6px 20px -12px rgba(14,42,49,.4)}
.ev-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.date-box{text-align:center;flex:none;min-width:46px}
.date-box .d{font-family:'Spectral',serif;font-size:1.5rem;font-weight:700;line-height:1;color:var(--summit)}
.date-box .wd{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);margin-top:2px}
.ev-main{flex:1;min-width:0}
.ev-name{font-family:'Spectral',serif;font-size:1.08rem;font-weight:600;line-height:1.25}
.ev-sub{font-size:.8rem;color:var(--ink-soft);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.ev-sub b{color:var(--ink);font-weight:600}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.badge{font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.badge.dim{color:#fff}
.badge.pri{background:#FBECEC;color:#B23A3A}
.badge.pri.media{background:#FBF3E4;color:#9A6A16}
.badge.tag{background:#EEF3F2;color:var(--ink-soft)}
.chev{margin-left:auto;color:var(--ink-soft);transition:transform .2s;flex:none}
.card.open .chev{transform:rotate(180deg)}
.details{max-height:0;overflow:hidden;transition:max-height .28s ease}
.card.open .details{max-height:400px}
.details-in{padding:14px 2px 4px;border-top:1px dashed var(--line);margin-top:12px}
.details-in h4{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dawn-deep);margin-bottom:4px}
.details-in p{font-size:.88rem;color:var(--ink-soft);margin-bottom:10px}
.gcal{
  display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;
  color:var(--summit);text-decoration:none;border:1px solid var(--line);
  padding:7px 12px;border-radius:9px;background:var(--mist)
}
.gcal:hover{border-color:var(--dawn);color:var(--dawn-deep)}
.today-marker{display:flex;align-items:center;gap:10px;margin:4px 0 16px;padding-left:0}
.today-marker .pin{background:var(--dawn);color:#3a2a06;font-size:.7rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;padding:4px 11px;border-radius:999px}
.today-marker .ln{flex:1;height:2px;background:linear-gradient(90deg,var(--dawn),transparent)}
.empty{text-align:center;padding:50px 20px;color:var(--ink-soft)}
.empty svg{opacity:.4;margin-bottom:10px}

footer{background:var(--summit);color:#9FBAB6;text-align:center;padding:26px 20px;font-size:.82rem}
footer .lema{font-family:'Spectral',serif;font-style:italic;color:var(--dawn);font-size:1rem;margin-bottom:6px}

@media(max-width:640px){
  .wrap{padding:0 14px}
  header{padding-top:26px}
  .brand{gap:12px}
  .mark{width:42px;height:42px}
  .brand-txt h1{font-size:1.35rem}
  .brand-txt .eyebrow{font-size:.65rem;letter-spacing:.2em}
  .next-banner{margin-top:18px;padding:14px 0 20px}
  .countdown{margin-left:0;text-align:left;width:100%;margin-top:10px;
    display:flex;align-items:baseline;gap:8px}
  .countdown .num{font-size:1.6rem}
  .upcoming{padding:20px 0 4px}
  .up-scroll{display:flex;overflow-x:auto;gap:10px;scroll-snap-type:x mandatory;
    padding-bottom:8px;scrollbar-width:none}
  .up-scroll::-webkit-scrollbar{display:none}
  .up-card{flex:0 0 78%;scroll-snap-align:start}
  .controls{padding:12px 0 10px}
  .month-h{font-size:1.25rem}
  .date-box{min-width:38px}
  .date-box .d{font-size:1.3rem}
  .ev-name{font-size:1rem}
  .card{padding:12px 13px}
  .section-h{font-size:1.05rem}
}
@media print{
  .controls,.upcoming,.chev,.gcal,.range,.countdown,.quickrow,.grid-nav{display:none}
  .details{max-height:none!important}
  body{background:#fff}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" fill="none">
        <path d="M4 54 L24 18 L34 36 L42 22 L60 54 Z" fill="#3E8B8B" opacity=".55"/>
        <path d="M4 54 L26 14 L44 46 L54 30 L60 54 Z" fill="#E0A340" opacity=".9"/>
        <rect x="30" y="6" width="4" height="16" fill="#fff"/>
        <rect x="25" y="11" width="14" height="4" fill="#fff"/>
      </svg>
      <div class="brand-txt">
        <div class="eyebrow">¡Vive tu Ascenso!</div>
        <h1>Fraternidad MonteCristo</h1>
        <div class="sub">Calendario 2026 · Año de la Fraternidad</div>
      </div>
    </div>
    <div class="next-banner">
      <div>
        <div class="label">Siguiente en la senda</div>
        <div class="next-title" id="nextTitle">—</div>
        <div class="next-meta" id="nextMeta"></div>
      </div>
      <div class="countdown">
        <div class="num" id="cdNum">—</div>
        <div class="cap" id="cdCap">días</div>
      </div>
    </div>
  </div>
  <svg class="range" viewBox="0 0 1440 70" preserveAspectRatio="none">
    <path d="M0 70 L180 26 L320 58 L520 14 L700 54 L900 22 L1080 60 L1260 30 L1440 66 L1440 70 Z" fill="#0B2228"/>
  </svg>
</header>

<div class="wrap">
  <section class="upcoming">
    <div class="section-h">Próximos eventos</div>
    <div class="up-scroll" id="upcoming"></div>
  </section>
</div>

<div class="controls">
  <div class="wrap">
    <div class="searchrow">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search" placeholder="Buscar actividad…" autocomplete="off">
        <button class="clr" id="clrSearch" aria-label="Limpiar búsqueda"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="count-badge"><b id="countNum">0</b> <span id="countWord">actividades</span></div>
    </div>
    <div class="quickrow">
      <div class="seg" id="viewSeg">
        <button data-view="list" class="on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Lista</button>
        <button data-view="grid"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Calendario</button>
      </div>
      <div class="quick" id="quickRange">
        <button data-range="today">Hoy</button>
        <button data-range="week">Esta semana</button>
        <button data-range="month">Este mes</button>
      </div>
    </div>
    <div id="monthSection">
      <div class="filt-head">
        <span class="lbl">Mes</span>
      </div>
      <div class="month-row" id="monthRow"></div>
    </div>
    <div class="filterbar">
      <div class="seg" id="priSeg">
        <button data-pri="all" class="on">Toda prioridad</button>
        <button data-pri="Alta">Alta</button>
        <button data-pri="Media">Media</button>
      </div>

 {d:"2026-12-18",t:"18:00",n:"Posada en la Parroquia de MXto",dim:"espiritual",tag:"Posada",pri:"Media",note:"Organiza D. Espiritual.",resp:"Apoyo en la posada."},
 {d:"2026-12-19",t:"19:00",n:"Posada Parroquial",dim:"parroquial",tag:"Posada",pri:"Media",note:"Posada de la parroquia.",resp:"Participar."},
 {d:"2026-12-20",t:"20:00",n:"Posada MonteCristiana",dim:"todos",tag:"Posada",pri:"Alta",mine:["redes"],note:"Posada de la Fraternidad.",resp:"Participar y documentar en redes."},
 {d:"2026-12-24",t:"20:00",n:"Hora Santa",dim:"humana",tag:"Liturgia",pri:"Media",note:"Dirige D. Humana.",resp:"Apoyo en la Hora Santa."},
 {d:"2026-12-26",t:"19:00",n:"Concierto de Navidad",dim:"todos",tag:"Evento Mayor",pri:"Media",mine:["redes"],note:"Concierto navideño.",resp:"Participar y documentar en redes."},
 {d:"2026-12-31",t:"20:00",n:"Hora Santa de Perdón",dim:"espiritual",tag:"Liturgia",pri:"Media",note:"Dirige D. Espiritual.",resp:"Cierre de año en oración."},
 {d:"2026-12-01",t:"",n:"Cumpleaños Angélica Guillén",dim:"cumple",tag:"Cumpleaños",pri:"—"},
 {d:"2026-12-09",t:"",n:"Cumpleaños Diego Chan",dim:"cumple",tag:"Cumpleaños",pri:"—"},
];

/* ---------- STATE ---------- */
const MONTHS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const WD=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const WD_GRID=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
let activeDims=new Set(Object.keys(DIMS));
let monthFilter="all", query="", priFilter="all";
let viewMode="list", rangeFilter="all", selectedDay=null;
const today=new Date(); today.setHours(0,0,0,0);
// week bounds (Monday–Sunday) containing today
const weekStart=new Date(today); weekStart.setDate(today.getDate()-((today.getDay()+6)%7));
const weekEnd=new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
// grid starts on the month of today if it's in 2026, else January
let gridMonth = today.getFullYear()===2026 ? today.getMonth() : 0;
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();

EV.forEach(e=>{const p=e.d.split("-");e._dt=new Date(+p[0],+p[1]-1,+p[2]); e._m=+p[1]-1;});
EV.sort((a,b)=> a._dt-b._dt || (a.t||"").localeCompare(b.t||""));

/* ---------- BUILD CONTROLS ---------- */
const monthRow=document.getElementById("monthRow");
const monthBtns=[];
function addMonthBtn(label,val){
  const b=document.createElement("button");
  b.className="mchip"+(val==="all"?" on":""); b.textContent=label; b.dataset.month=val;
  b.onclick=()=>{
    monthFilter=val;
    monthBtns.forEach(x=>x.classList.toggle("on",x===b));
    // month chip and quick-range are mutually exclusive
    rangeFilter="all"; quickBtns.forEach(x=>x.classList.remove("on"));
    render();
  };
  monthRow.appendChild(b); monthBtns.push(b);
}
addMonthBtn("Todo el año","all");
MONTHS.forEach((m,i)=>addMonthBtn(m.slice(0,3),i));

const chipsEl=document.getElementById("chips");
const chipEls={};
Object.entries(DIMS).forEach(([k,v])=>{
  const c=document.createElement("div");
  c.className="chip"; c.dataset.dim=k; c.tabIndex=0; c.setAttribute("role","button");
  c.style.setProperty("--dc",DIM_HEX[k]);
  c.style.setProperty("--dc-tint",DIM_HEX[k]+"1E");
  c.innerHTML=`<span class="swatch" style="background:${DIM_HEX[k]}"></span>`+
    `<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>`+
    `${v.name}<span class="ct"></span>`;
  const toggle=()=>{ activeDims.has(k)?activeDims.delete(k):activeDims.add(k); render(); };
  c.onclick=toggle;
  c.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();toggle();}};
  chipEls[k]=c;
  chipsEl.appendChild(c);
});

// Segmented: prioridad
document.getElementById("priSeg").querySelectorAll("button").forEach(b=>{
  b.onclick=()=>{
    priFilter = b.dataset.pri;
    document.querySelectorAll("#priSeg button").forEach(x=>x.classList.toggle("on",x===b));
    render();
  };
});

// View toggle (Lista / Calendario)
document.getElementById("viewSeg").querySelectorAll("button").forEach(b=>{
  b.onclick=()=>{
    viewMode=b.dataset.view;
    document.querySelectorAll("#viewSeg button").forEach(x=>x.classList.toggle("on",x===b));
    document.getElementById("timeline").style.display = viewMode==="list"?"":"none";
    document.getElementById("gridWrap").style.display = viewMode==="grid"?"":"none";
    document.getElementById("monthSection").style.display = viewMode==="grid"?"none":"";
    render();
  };
});

// Quick range (Hoy / Esta semana / Este mes) — always operate on the list
const quickBtns=[...document.querySelectorAll("#quickRange button")];
quickBtns.forEach(b=>{
  b.onclick=()=>{
    const r=b.dataset.range;
    if(rangeFilter===r){ rangeFilter="all"; b.classList.remove("on"); }
    else{ rangeFilter=r; quickBtns.forEach(x=>x.classList.toggle("on",x===b)); }
    // clear month chip; switch to list so the range reads clearly
    monthFilter="all"; monthBtns.forEach(x=>x.classList.toggle("on",x.dataset.month==="all"));
    if(viewMode!=="list"){
      viewMode="list";
      document.querySelectorAll("#viewSeg button").forEach(x=>x.classList.toggle("on",x.dataset.view==="list"));
      document.getElementById("timeline").style.display="";
      document.getElementById("gridWrap").style.display="none";
      document.getElementById("monthSection").style.display="";
    }
    render();
  };
});

// Grid month navigation
document.getElementById("gPrev").onclick=()=>{ if(gridMonth>0){gridMonth--;selectedDay=null;render();} };
document.getElementById("gNext").onclick=()=>{ if(gridMonth<11){gridMonth++;selectedDay=null;render();} };

// Search + clear
const searchInput=document.getElementById("search"), clrBtn=document.getElementById("clrSearch");
searchInput.oninput=e=>{query=e.target.value.toLowerCase();clrBtn.classList.toggle("show",!!e.target.value);render();};
clrBtn.onclick=()=>{searchInput.value="";query="";clrBtn.classList.remove("show");render();searchInput.focus();};

// Todas / Limpiar
document.getElementById("allDims").onclick=()=>{activeDims=new Set(Object.keys(DIMS));render();};
document.getElementById("clearDims").onclick=()=>{activeDims.clear();render();};

/* refresh chip visual state + live counts (counts respect the OTHER active filters) */
function refreshChips(){
  const allOn=activeDims.size===Object.keys(DIMS).length;
  document.getElementById("allDims").disabled=allOn;
  document.getElementById("clearDims").disabled=activeDims.size===0;
  Object.keys(DIMS).forEach(k=>{
    const c=chipEls[k];
    c.classList.toggle("active",activeDims.has(k));
    const n=EV.filter(e=>e.dim===k && matchesExceptDim(e)).length;
    c.querySelector(".ct").textContent=n;
    c.classList.toggle("zero",n===0);
  });
}

/* ---------- HELPERS ---------- */
function gcalLink(e){
  const dt=e._dt; const y=dt.getFullYear(),mo=String(dt.getMonth()+1).padStart(2,'0'),da=String(dt.getDate()).padStart(2,'0');
  let start,end;
  if(e.t){const[h,mi]=e.t.split(":");start=`${y}${mo}${da}T${h}${mi}00`;
    const ed=new Date(dt);ed.setHours(+h+1,+mi);end=`${y}${mo}${da}T${String(ed.getHours()).padStart(2,'0')}${mi}00`;}
  else{start=`${y}${mo}${da}`;const nd=new Date(dt);nd.setDate(nd.getDate()+1);end=`${nd.getFullYear()}${String(nd.getMonth()+1).padStart(2,'0')}${String(nd.getDate()).padStart(2,'0')}`;}
  const txt=encodeURIComponent(e.n),det=encodeURIComponent((e.note||"")+(e.resp?"\n\nResponsabilidades: "+e.resp:""));
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${txt}&dates=${start}/${end}&details=${det}`;
}
function matchesExceptDim(e){
  if(monthFilter!=="all"&&e._m!=+monthFilter)return false;
  if(priFilter!=="all"&&e.pri!==priFilter)return false;
  if(rangeFilter==="today"&&!sameDay(e._dt,today))return false;
  if(rangeFilter==="week"&&!(e._dt>=weekStart&&e._dt<=weekEnd))return false;
  if(rangeFilter==="month"&&!(e._dt.getMonth()===today.getMonth()&&e._dt.getFullYear()===today.getFullYear()))return false;
  if(query&&!e.n.toLowerCase().includes(query))return false;
  return true;
}
function matches(e){ return activeDims.has(e.dim) && matchesExceptDim(e); }

/* ---------- UPCOMING + COUNTDOWN ---------- */
function refreshUpcoming(){
  const up=EV.filter(e=>e._dt>=today && e.dim!=="cumple").slice(0,4);
  const box=document.getElementById("upcoming");
  box.innerHTML= up.length? "" : '<div style="color:var(--ink-soft);font-size:.9rem">No hay más eventos programados este año.</div>';
  up.forEach(e=>{
    const days=Math.round((e._dt-today)/864e5);
    const inTxt= days===0?"Hoy":days===1?"Mañana":`En ${days} días`;
    const card=document.createElement("div");card.className="up-card";
    card.innerHTML=`<div class="accent" style="background:${DIM_HEX[e.dim]}"></div>
      <div class="up-when">${WD[e._dt.getDay()]} ${e._dt.getDate()} ${MONTHS[e._m].slice(0,3)}${e.t?" · "+e.t:""}</div>
      <div class="up-name">${e.n}</div>
      ${e.note?`<div class="up-detail">${e.note}</div>`:""}
      <div class="up-foot">
        <span class="up-dim" style="background:${DIM_HEX[e.dim]}">${DIMS[e.dim].name}</span>
        <span class="up-in">${inTxt}</span>
      </div>`;
    box.appendChild(card);
  });
  // countdown to very next event
  const nx=EV.find(e=>e._dt>=today && e.dim!=="cumple");
  if(nx){
    document.getElementById("nextTitle").textContent=nx.n;
    document.getElementById("nextMeta").textContent=`${WD[nx._dt.getDay()]} ${nx._dt.getDate()} de ${MONTHS[nx._m]}${nx.t?" · "+nx.t:""}`;
    const days=Math.round((nx._dt-today)/864e5);
    document.getElementById("cdNum").textContent= days===0?"¡Hoy!":days;
    document.getElementById("cdCap").textContent= days===0?"":days===1?"día":"días";
  }
}

/* ---------- CARD MARKUP (shared) ---------- */
function cardInner(e){
  const isCumple=e.dim==="cumple";
  const hasDetails=!isCumple && (e.note||e.resp);
  return `<div class="card ${hasDetails?'':'nodet'}" style="border-left-color:${DIM_HEX[e.dim]}" ${hasDetails?'onclick="this.classList.toggle(\'open\')"':''}>
    <div class="ev-top">
      <div class="date-box"><div class="d">${e._dt.getDate()}</div><div class="wd">${WD[e._dt.getDay()]}</div></div>
      <div class="ev-main">
        <div class="ev-name">${e.n}</div>
        <div class="ev-sub">${e.t?`<span>🕐 ${e.t}</span>`:""}</div>
        <div class="badges">
          <span class="badge dim" style="background:${DIM_HEX[e.dim]}">${DIMS[e.dim].name}</span>
          ${e.tag&&!isCumple?`<span class="badge tag">${e.tag}</span>`:""}
          ${e.pri==="Alta"?'<span class="badge pri">Prioridad Alta</span>':e.pri==="Media"?'<span class="badge pri media">Prioridad Media</span>':""}
        </div>
      </div>
      ${hasDetails?'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>':""}
    </div>
    ${hasDetails?`<div class="details"><div class="details-in">
      ${e.note?`<h4>Objetivo</h4><p>${e.note}</p>`:""}
      ${e.resp?`<h4>Responsabilidades</h4><p>${e.resp}</p>`:""}
      <a class="gcal" href="${gcalLink(e)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
        Agregar a Google Calendar</a>
    </div></div>`:""}
  </div>`;
}

/* ---------- RENDER (dispatcher) ---------- */
function setCount(n){
  document.getElementById("countNum").textContent=n;
  document.getElementById("countWord").textContent=n===1?"actividad":"actividades";
}
function render(){
  refreshChips();
  const list=EV.filter(matches);
  if(viewMode==="grid"){
    setCount(list.filter(e=>e._m===gridMonth).length);
    renderGrid(list);
  }else{
    setCount(list.length);
    renderList(list);
  }
}

/* ---------- LIST (timeline) ---------- */
function renderList(list){
  const tl=document.getElementById("timeline");
  if(!list.length){
    tl.innerHTML=`<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg><div>Ninguna actividad coincide con estos filtros.</div><br><button class="linkbtn" style="font-size:.85rem" onclick="resetFilters()">Restablecer filtros</button></div>`;
    return;
  }
  let html="", curM=-1, todayPlaced=false;
  list.forEach(e=>{
    if(e._m!==curM){
      if(curM!==-1)html+="</div></div>";
      curM=e._m;
      html+=`<div class="month-group"><div class="month-h">${MONTHS[curM]}<span class="yr">2026</span></div><div class="rail">`;
    }
    if(!todayPlaced && e._dt>=today){
      todayPlaced=true;
      html+=`<div class="today-marker"><span class="pin">Hoy · ${today.getDate()} ${MONTHS[today.getMonth()].slice(0,3)}</span><span class="ln"></span></div>`;
    }
    const isCumple=e.dim==="cumple";
    html+=`<div class="ev ${isCumple?'cumple':''}" style="--dc:${DIM_HEX[e.dim]}">${cardInner(e)}</div>`;
  });
  html+="</div></div>";
  tl.innerHTML=html;
}

/* ---------- GRID (calendar) ---------- */
function renderGrid(list){
  const y=2026, m=gridMonth;
  document.getElementById("gTitle").textContent=`${MONTHS[m]} 2026`;
  document.getElementById("gPrev").disabled=(m===0);
  document.getElementById("gNext").disabled=(m===11);
  document.getElementById("gHead").innerHTML=WD_GRID.map(d=>`<div>${d}</div>`).join("");
  const byDay={};
  list.filter(e=>e._m===m).forEach(e=>{(byDay[e._dt.getDate()]=byDay[e._dt.getDate()]||[]).push(e);});
  const lead=(new Date(y,m,1).getDay()+6)%7;      // Monday-start offset
  const daysIn=new Date(y,m+1,0).getDate();
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<div class="cell empty"></div>`;
  for(let d=1;d<=daysIn;d++){
    const evs=byDay[d]||[];
    const cd=new Date(y,m,d);
    const isToday=sameDay(cd,today), isPast=cd<today&&!isToday;
    const pills=evs.slice(0,3).map(e=>`<span class="pill" style="background:${DIM_HEX[e.dim]}" title="${e.n.replace(/"/g,'&quot;')}">${e.n}</span>`).join("");
    const dots=evs.slice(0,5).map(e=>`<span class="dot-ev" style="background:${DIM_HEX[e.dim]}"></span>`).join("");
    const more=evs.length>3?`<span class="more">+${evs.length-3} más</span>`:"";
    cells+=`<div class="cell ${evs.length?'has':''} ${isToday?'today':''} ${isPast?'past':''} ${selectedDay===d?'sel':''}" ${evs.length?`data-day="${d}"`:''}>
      <span class="cnum">${d}</span>${pills}${more}<span class="dots">${dots}</span>
    </div>`;
  }
  document.getElementById("gBody").innerHTML=cells;
  document.querySelectorAll('#gBody .cell.has').forEach(c=>{
    c.onclick=()=>{ selectedDay=+c.dataset.day; render(); };
  });
  renderDayPanel(list);
}
function renderDayPanel(list){
  const panel=document.getElementById("dayPanel");
  if(selectedDay==null){panel.innerHTML="";return;}
  const evs=list.filter(e=>e._m===gridMonth && e._dt.getDate()===selectedDay);
  if(!evs.length){panel.innerHTML="";return;}
  const dt=new Date(2026,gridMonth,selectedDay);
  panel.innerHTML=`<h3>${WD[dt.getDay()]} ${selectedDay} de ${MONTHS[gridMonth]}</h3>`+
    evs.map(e=>`<div class="ev" style="--dc:${DIM_HEX[e.dim]}">${cardInner(e)}</div>`).join("");
}

function resetFilters(){
  activeDims=new Set(Object.keys(DIMS));
  monthFilter="all"; priFilter="all"; query=""; rangeFilter="all";
  searchInput.value=""; clrBtn.classList.remove("show");
  monthBtns.forEach(x=>x.classList.toggle("on",x.dataset.month==="all"));
  quickBtns.forEach(x=>x.classList.remove("on"));
  document.querySelectorAll("#priSeg button").forEach(x=>x.classList.toggle("on",x.dataset.pri==="all"));
  render();
}

refreshUpcoming();
render();
setInterval(refreshUpcoming,60000);
</script>
